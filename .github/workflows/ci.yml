name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  module:
    uses: Aqamoe/FGB-Module-Kit/.github/workflows/module-ci.yml@v0.4.0
    with:
      # 冒烟测试会自建共享内存映射 VRCFTMemmapData，GitHub 的 Windows runner 上是空闲的，
      # 这一项是真正的端到端 ABI 校验，别关掉。
      run_smoke: true
    secrets: inherit
